<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>玄门正典</title>
  <style>
    :root {
      --bg: #f7f4ed;
      --bg2: #efeae0;
      --paper: #fdfbf7;
      --ink: #1a1816;
      --muted: #6e665a;
      --rule: #d8d0c2;
      --accent: #a83f28;
      --accent2: #2c5a4c;
      --shadow: rgba(26, 24, 22, 0.06);
      --radius: 8px;
      --reader-font-size: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", "Songti SC", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.8;
      letter-spacing: 0.02em;
      min-height: 100vh;
    }

    /* 宣纸纹理 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 24px, rgba(110, 102, 90, 0.025) 25px),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      z-index: -1;
    }

    #app {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 1.25rem 4rem;
    }

    /* 顶部导航 */
    header.topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(247, 244, 237, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rule);
      padding: 0.9rem 0;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      cursor: pointer;
      text-decoration: none;
      color: var(--ink);
    }

    .brand-seal {
      width: 32px;
      height: 32px;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-size: 0.55rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;

      letter-spacing: 0.05em;

    .topbar-actions {
      display: flex;

    button {
      font-family: inherit;

    button:hover {

    button.primary:hover {
      background: #8e3320;
    }

    button.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    /* 首页书架 */
    .hero {
      text-align: center;
      padding: 3rem 0 2.5rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 7vw, 3.2rem);
      letter-spacing: 0.12em;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }

    .hero p {
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.05em;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid var(--ink);
      letter-spacing: 0.08em;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1.2rem;
    }

    .book-card {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 1.2rem 0.8rem;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 3px 14px var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(26, 24, 22, 0.12);
    }

    .book-card::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;

    .book-card .title {
      font-size: 1.05rem;

    /* 书目详情 */
    .book-header {
      text-align: center;
      padding: 1.5rem 0 2rem;
    }

    .book-header h2 {
      font-size: clamp(1.6rem, 5vw, 2.2rem);

    .book-header .category-tag {

    .chapter-list {
      display: grid;
      gap: 0.6rem;
    }

    .chapter-item {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .chapter-item:hover {
      border-color: var(--accent);
      background: #fffaf5;
    }

    .chapter-item .progress-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--rule);

    }

    .chapter-item.read .progress-dot {

    /* 阅读器 */
    .reader-toolbar {
      display: flex;
      flex-wrap: wrap;

      justify-content: center;
      align-items: center;
      padding: 0.8rem 0;

      border-bottom: 1px solid var(--rule);

    .reader-toolbar .tool-group {
      display: flex;
      gap: 0.3rem;

    }

    .reader-toolbar .tool-label {

    .reader-toolbar .font-size-display {
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 3.2rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .reader-content {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 2.5rem 1.8rem;
      box-shadow: 0 4px 24px var(--shadow);
      min-height: 60vh;
      font-size: var(--reader-font-size);
    }

    .reader-content .source,
    .reader-content .translation {
      font-size: var(--reader-font-size);
    }

    .reader-content h1.chapter-title {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 2.5rem;
      letter-spacing: 0.08em;
    }

    .block {
      margin-bottom: 1.8rem;
      position: relative;
      padding-left: 0;
      transition: background 0.3s ease;
    }

    .block.highlight {
      background: rgba(168, 63, 40, 0.08);
      margin: 0 -0.8rem;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
    }

    .block.bookmarked::before {
      content: "";
      position: absolute;
      left: -1.2rem;
      top: 0.3rem;
      bottom: 0.3rem;
      width: 4px;
      background: var(--accent);
      border-radius: 2px;
    }

    .block .source {
      font-size: 1.05rem;
      line-height: 1.9;
      margin-bottom: 0.8rem;
      text-align: justify;
    }

    .block .translation {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.85;
      padding-left: 1rem;
      border-left: 3px solid var(--rule);
      text-align: justify;
    }

    .block.title-block {
      text-align: center;
    }

    .block.title-block .source {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      text-align: center;
    }

    .block.title-block .translation {
      display: none;
    }

    .translation hr {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 1.2rem 0;
    }

    /* 阅读进度条 */
    .reading-progress {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--rule);
      z-index: 200;
    }

    .reading-progress .bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }

    /* 空状态 */
    .empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }

    .empty h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: var(--ink);
    }

    /* 响应式 */
    @media (max-width: 640px) {
      #app { padding: 0 0.9rem 3rem; }
      .brand-title { font-size: 1.05rem; }
      .crumb { display: none; }
      .reader-content { padding: 1.5rem 1rem; }
      .reader-content h1.chapter-title { font-size: 1.4rem; margin-bottom: 1.8rem; }
      .block .source { font-size: 1rem; }
      .block .translation { font-size: 0.9rem; padding-left: 0.7rem; }
      .book-grid { grid-template-columns: repeat(2, 1fr); gap: 0.9rem; }
      .book-card { min-height: 130px; padding: 1rem 0.6rem; }
      .book-card .title { font-size: 0.95rem; }
    }

    /* 工具提示 */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--paper);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 300;
    }

    .toast.show { opacity: 1; }
  </style>

<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" onclick="goHome()">
        <div class="brand-seal">玄门<br>正典</div>
        <div class="brand-title">玄门正典</div>
      </a>
      <div class="crumb" id="crumb"></div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <main id="main"></main>
  </div>

  <div class="reading-progress" id="reading-progress" style="display:none;">
    <div class="bar" id="progress-bar"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 全局状态
    let appData = null;
    let currentView = 'home';
    let currentBookId = null;
    let currentChapterId = null;
    let readingMode = localStorage.getItem('xuanmen_mode') || 'mixed'; // 'source' | 'mixed'
    let fontSize = parseInt(localStorage.getItem('xuanmen_fontsize') || '18', 10);

    const LS_KEY = 'xuanmen_progress';

    // 初始化
    document.addEventListener('DOMContentLoaded', async () => {
      // 应用保存的字号
      document.documentElement.style.setProperty('--reader-font-size', fontSize + 'px');
      try {
        const res = await fetch('data/books.json');
        if (!res.ok) throw new Error('无法加载古籍数据');
        appData = await res.json();
        restoreLastPosition();
      } catch (err) {
        document.getElementById('main').innerHTML = `
          <div class="empty">
            <h3>数据加载失败</h3>
            <p>${err.message}</p>
            <p>请先运行 scripts/scan-guji.ps1 生成 data/books.json</p>
          </div>`;
      }
    });

    // 工具函数
    function getBook(id) {
      for (const cat of appData.categories) {
        const book = cat.books.find(b => b.id === id);
        if (book) return book;
      }
      return null;
    }

    function getCategoryName(book) {
      for (const cat of appData.categories) {
        if (cat.books.some(b => b.id === book.id)) return cat.name;
      }
      return '';
    }

    function getProgress() {
      try {
        return JSON.parse(localStorage.getItem(LS_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveProgress(bookId, chapterId, blockId, percent, scrollY) {
      const progress = getProgress();
      progress[bookId] = { chapterId, blockId, percent, scrollY, updatedAt: Date.now() };
      localStorage.setItem(LS_KEY, JSON.stringify(progress));
    }

    function getChapterProgress(bookId, chapterId) {
      const progress = getProgress();
      const p = progress[bookId];
      return p && p.chapterId === chapterId ? p : null;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    // 视图：首页
    function goHome() {
      currentView = 'home';
      currentBookId = null;
      currentChapterId = null;
      updateUrl();
      render();
    }

    function updateUrl() {
      const params = new URLSearchParams();
      if (currentBookId) params.set('book', currentBookId);
      if (currentChapterId) params.set('chapter', currentChapterId);
      const qs = params.toString();
      const url = qs ? '?' + qs : window.location.pathname;
      history.pushState(null, '', url);
    }

    function renderHome() {
      const main = document.getElementById('main');
      let html = `
        <div class="hero">
          <h1>玄门正典</h1>
          <p>本地古籍数字化阅读 · 共收录 ${appData.categories.reduce((sum, c) => sum + c.books.length, 0)} 部经典</p>
        </div>
      `;

      for (const cat of appData.categories) {
        html += `<h3 class="section-title">${cat.name}</h3>`;
        html += `<div class="book-grid">`;
        for (const book of cat.books) {
          const last = getProgress()[book.id];
          let meta = '';
          if (last) {
            if (book.chapters.length === 1) {
              const percent = Math.min(100, Math.round(last.percent || 0));
              meta = `已读 ${percent}%`;
            } else {
              meta = `已读至：${getChapterTitle(book, last.chapterId)}`;
            }
          } else {
            meta = book.chapters.length === 1 ? '单篇' : `${book.chapters.length} 章`;
          }
          html += `
            <div class="book-card" role="button" tabindex="0"
                 onclick="openBook('${book.id}')"
                 onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openBook('${book.id}')}">
              <div class="title">${book.title}</div>
              <div class="meta">${meta}</div>
            </div>
          `;
        }
        html += `</div>`;
      }

      main.innerHTML = html;
      updateTopbar();
    }

    function getChapterTitle(book, chapterId) {
      const ch = book.chapters.find(c => c.id === chapterId);
      return ch ? ch.title : '未知章节';
    }

    // 视图：书目详情
    function openBook(bookId) {
      currentBookId = bookId;
      currentChapterId = null;
      currentView = 'book';

      const book = getBook(bookId);
      const progress = getProgress()[bookId];

      if (book && book.chapters.length === 1) {
        // 单篇经书直接跳转到正文，并恢复上次阅读位置
        currentChapterId = book.chapters[0].id;
        currentView = 'reader';
        updateUrl();
        render(null, progress && progress.scrollY ? progress.scrollY : null);
        return;
      }

      updateUrl();
      render();
    }

    function renderBook() {
      const book = getBook(currentBookId);
      if (!book) return goHome();
      const progress = getProgress()[book.id];

      const main = document.getElementById('main');
      let html = `
        <div class="book-header">
          <h2>${book.title}</h2>
          <span class="category-tag">${book.category}</span>
        </div>
      `;

      if (progress) {
        const resumeScrollY = typeof progress.scrollY === 'number' ? progress.scrollY : null;
        html += `<div style="text-align:center;margin-bottom:1.5rem;">
          <button class="primary" onclick="openReader('${book.id}', '${progress.chapterId}', '${progress.blockId || ''}', ${resumeScrollY})">继续阅读：${getChapterTitle(book, progress.chapterId)}</button>
        </div>`;
      }

      html += `<div class="chapter-list">`;
      for (const ch of book.chapters) {
        const chProgress = getChapterProgress(book.id, ch.id);
        const readClass = chProgress ? 'read' : '';
        html += `
          <div class="chapter-item ${readClass}" onclick="openReader('${book.id}', '${ch.id}')">
            <span>${ch.title}</span>
            <span class="progress-dot"></span>
          </div>
        `;
      }
      html += `</div>`;

      main.innerHTML = html;
      updateTopbar();
    }

    // 视图：阅读器
    function openReader(bookId, chapterId, blockId, scrollY) {
      currentBookId = bookId;
      currentChapterId = chapterId;
      currentView = 'reader';
      updateUrl();
      render(blockId, scrollY);
    }

    function renderReader(targetBlockId, targetScrollY) {
      const book = getBook(currentBookId);
      const chapter = book.chapters.find(c => c.id === currentChapterId);
      if (!chapter) return goHome();

      const main = document.getElementById('main');
      const showTranslation = readingMode === 'mixed';
      main.innerHTML = `
        <div class="reader-toolbar">
          <div class="tool-group">
            <button id="btn-translate" class="${showTranslation ? 'active' : ''}" onclick="toggleTranslation()">
              ${showTranslation ? '隐藏译文' : '显示译文'}
            </button>
          </div>
          <div class="tool-group">
            <span class="tool-label">字号</span>
            <button onclick="changeFontSize(-1)" aria-label="减小字号">A-</button>
            <span id="font-size-display" class="font-size-display">${fontSize}px</span>
            <button onclick="changeFontSize(1)" aria-label="增大字号">A+</button>
          </div>
        </div>
        <div class="reader-content" id="reader-content">
          <h1 class="chapter-title">${chapter.title}</h1>
          <div id="reader-blocks"></div>
        </div>
      `;

      const blocksEl = document.getElementById('reader-blocks');
      let html = '';
      for (const block of chapter.blocks) {
        const isTitle = block.type === 'title';
        const titleClass = isTitle ? 'title-block' : '';
        const transHtml = (readingMode === 'mixed' && block.translation && !isTitle)
          ? `<div class="translation">${renderMarkdown(block.translation)}</div>`
          : '';
        const highlight = targetBlockId && block.id === targetBlockId ? 'highlight' : '';
        html += `
          <div class="block ${titleClass} ${highlight}" id="block-${block.id}" data-block-id="${block.id}">
            <div class="source">${renderMarkdown(block.content)}</div>
            ${transHtml}
          </div>
        `;
      }
      blocksEl.innerHTML = html;

      updateTopbar();
      setupReaderScroll(book, chapter);
      document.getElementById('reading-progress').style.display = 'block';

      // 恢复位置
      if (targetBlockId) {
        setTimeout(() => {
          const el = document.getElementById(`block-${targetBlockId}`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => el.classList.remove('highlight'), 3000);
          }
        }, 100);
      } else if (typeof targetScrollY === 'number' && targetScrollY > 0) {
        setTimeout(() => {
          const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
          window.scrollTo({ top: Math.min(targetScrollY, maxScroll), behavior: 'auto' });
        }, 150);
      }
    }

    function setupReaderScroll(book, chapter) {
      const content = document.getElementById('reader-content');
      const blocks = content.querySelectorAll('.block');

      const onScroll = () => {
        const rect = content.getBoundingClientRect();
        const viewportCenter = rect.top + rect.height / 2;
        let currentBlock = chapter.blocks[0];
        let maxVisible = 0;

        blocks.forEach(el => {
          const r = el.getBoundingClientRect();
          const visibleHeight = Math.max(0, Math.min(r.bottom, rect.bottom) - Math.max(r.top, rect.top));
          if (visibleHeight > maxVisible) {
            maxVisible = visibleHeight;
            currentBlock = chapter.blocks.find(b => b.id === el.dataset.blockId);
          }
        });

        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const scrollPercent = docHeight > 0
          ? Math.min(100, Math.max(0, (window.scrollY / docHeight) * 100))
          : 0;

        document.getElementById('progress-bar').style.width = scrollPercent + '%';

        if (currentBlock) {
          saveProgress(book.id, chapter.id, currentBlock.id, scrollPercent, window.scrollY);
        }
      };

      window.addEventListener('scroll', onScroll, { passive: true });
      // 初始触发一次
      setTimeout(onScroll, 200);
    }

    function toggleTranslation() {
      readingMode = readingMode === 'mixed' ? 'source' : 'mixed';
      localStorage.setItem('xuanmen_mode', readingMode);
      render();
    }

    function changeFontSize(delta) {
      fontSize = Math.max(14, Math.min(26, fontSize + delta));
      localStorage.setItem('xuanmen_fontsize', fontSize);
      document.documentElement.style.setProperty('--reader-font-size', fontSize + 'px');
      const display = document.getElementById('font-size-display');
      if (display) display.textContent = fontSize + 'px';
    }

    // 通用渲染
    function render(blockId, scrollY) {
      if (!appData) return;
      if (currentView === 'home') renderHome();
      else if (currentView === 'book') renderBook();
      else if (currentView === 'reader') renderReader(blockId, scrollY);
    }

    function updateTopbar() {
      const crumb = document.getElementById('crumb');
      const actions = document.getElementById('topbar-actions');

      if (currentView === 'home') {
        crumb.innerHTML = '';
        actions.innerHTML = '';
      } else if (currentView === 'book') {
        const book = getBook(currentBookId);
        crumb.innerHTML = `<span onclick="goHome()">首页</span><span class="sep">/</span><span>${book.title}</span>`;
        actions.innerHTML = '';
      } else if (currentView === 'reader') {
        const book = getBook(currentBookId);
        const chapter = book.chapters.find(c => c.id === currentChapterId);
        const isSingle = book.chapters.length === 1;
        if (isSingle) {
          crumb.innerHTML = `<span onclick="goHome()">首页</span><span class="sep">/</span><span>${book.title}</span>`;
          actions.innerHTML = '';
        } else {
          crumb.innerHTML = `<span onclick="goHome()">首页</span><span class="sep">/</span><span onclick="openBook('${book.id}')">${book.title}</span><span class="sep">/</span><span>${chapter.title}</span>`;
          actions.innerHTML = `<button onclick="openBook('${book.id}')">目录</button>`;
        }
      }
    }

    function restoreLastPosition() {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('book');
      const chapterId = params.get('chapter');

      if (bookId && getBook(bookId)) {
        const book = getBook(bookId);
        const targetChapterId = chapterId || book.chapters[0].id;
        const progress = getProgress()[bookId];
        const scrollY = progress && progress.chapterId === targetChapterId ? progress.scrollY : null;
        openReader(bookId, targetChapterId, null, scrollY);
      } else {
        goHome();
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderMarkdown(text) {
      if (!text) return '';
      let html = escapeHtml(text);
      // 处理可能残留的字面量 \n（从 JSON 转义而来）
      html = html.replace(/\\n/g, '\n');
      html = html.replace(/\r\n/g, '\n');

      // 标题
      html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
      html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
      html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
      html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

      // 加粗 / 斜体
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/_(.+?)_/g, '<em>$1</em>');

      // 引用
      html = html.replace(/^&gt;\s*(.+)$/gm, '<blockquote>$1</blockquote>');

      // 水平分割线
      html = html.replace(/^-{3,}$/gm, '<hr>');
      html = html.replace(/^(\*\s*){3,}$/gm, '<hr>');

      // 换行
      html = html.replace(/\n/g, '<br>');

      return html;
    }
  </script>
</body>
</html>
