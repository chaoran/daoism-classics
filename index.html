<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b09">
  <title>玄门正典</title>
  <style>
    :root {
      --bg: #070b09;
      --bg2: #0b120d;
      --card: #0f1a13;
      --card2: #12211a;
      --ink: #d9e6dc;
      --muted: #7e968a;
      --faint: #4a5f53;
      --rule: #1c2e23;
      --jade: #4cc38a;
      --jade-deep: #2e7d5b;
      --jade-dim: rgba(76, 195, 138, 0.14);
      --shadow: rgba(0, 0, 0, 0.45);
      --radius: 10px;
      --reader-font-size: 19px;
      --font-kai: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "BiauKai", "DFKai-SB", "TW-Kai", serif;
      --topbar-h: 52px;
      --bottombar-h: 60px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-kai);
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.8;
      letter-spacing: 0.03em;
      min-height: 100vh;
      overscroll-behavior-y: none;
    }

    /* 暗夜纹理：极淡的竹影斜纹 + 颗粒 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(115deg, transparent, transparent 46px, rgba(76, 195, 138, 0.016) 47px, transparent 48px),
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(46, 125, 91, 0.10), transparent 60%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      z-index: -1;
    }

    #app { min-height: 100vh; }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: calc(var(--topbar-h) + env(safe-area-inset-top) + 8px) 1rem 5rem;
    }

    /* ======= 顶栏（应用式，可隐藏） ======= */
    header.topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: calc(var(--topbar-h) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 0.6rem 0;
      background: rgba(7, 11, 9, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.32s ease;
    }

    body.chrome-off header.topbar { transform: translateY(-110%); }

    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      user-select: none;
    }

    .brand-seal {
      width: 30px;
      height: 30px;
      border: 1.5px solid var(--jade);
      color: var(--jade);
      font-size: 0.52rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.15;
      letter-spacing: 0.04em;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(76, 195, 138, 0.18);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.22em;
    }

    .crumb {
      flex: 1;
      text-align: center;
      font-size: 0.92rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .crumb .sep { margin: 0 0.35rem; color: var(--faint); }

    .nav-btn {
      font-family: var(--font-kai);
      border: none;
      background: transparent;
      color: var(--jade);
      font-size: 0.95rem;
      padding: 0.4rem 0.5rem;
      cursor: pointer;
      border-radius: 8px;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .nav-btn:active { background: var(--jade-dim); }

    .pct {
      font-size: 0.85rem;
      color: var(--jade);
      font-variant-numeric: tabular-nums;
      min-width: 3rem;
      text-align: right;
    }

    /* ======= 顶部进度细线 ======= */
    .progress-line {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: transparent;
      z-index: 400;
    }

    .progress-line .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--jade-deep), var(--jade));
      box-shadow: 0 0 8px rgba(76, 195, 138, 0.55);
      transition: width 0.15s linear;
    }

    /* ======= 首页书架 ======= */
    .hero {
      padding: 1.6rem 0 1.2rem;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(1.7rem, 6vw, 2.4rem);
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      font-weight: 700;
      color: var(--ink);
      text-shadow: 0 0 24px rgba(76, 195, 138, 0.25);
    }

    .hero p {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      font-size: 1.05rem;
      font-weight: 700;
      margin: 1.8rem 0 0.7rem;
      letter-spacing: 0.18em;
      color: var(--jade);
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--rule), transparent);
    }

    .section-title .count {
      font-size: 0.75rem;
      color: var(--faint);
      font-weight: 400;
      letter-spacing: 0.05em;
    }

    .book-list { display: grid; gap: 0.6rem; }

    @media (min-width: 640px) {
      .book-list { grid-template-columns: 1fr 1fr; }
    }

    .book-row {
      display: flex;
      align-items: stretch;
      gap: 0.85rem;
      background: linear-gradient(155deg, var(--card2), var(--card));
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      touch-action: manipulation;
    }

    .book-row:active { transform: scale(0.985); }

    @media (hover: hover) {
      .book-row:hover {
        border-color: var(--jade-deep);
        box-shadow: 0 6px 22px var(--shadow);
        transform: translateY(-2px);
      }
    }

    .book-spine {
      width: 3px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--jade), var(--jade-deep));
      opacity: 0.75;
      flex-shrink: 0;
    }

    .book-info { flex: 1; min-width: 0; }

    .book-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.5;
    }

    .book-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.15rem;
      letter-spacing: 0.04em;
    }

    .book-progress {
      margin-top: 0.5rem;
      height: 3px;
      border-radius: 2px;
      background: var(--rule);
      overflow: hidden;
    }

    .book-progress .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--jade-deep), var(--jade));
    }

    /* ======= 章节列表 ======= */
    .book-header { text-align: center; padding: 1.2rem 0 1.4rem; }

    .book-header h2 {
      font-size: clamp(1.5rem, 5.5vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      margin-bottom: 0.5rem;
    }

    .category-tag {
      display: inline-block;
      padding: 0.15rem 0.75rem;
      border: 1px solid var(--jade-deep);
      color: var(--jade);
      border-radius: 20px;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
    }

    .continue-wrap { text-align: center; margin-bottom: 1.4rem; }

    button.primary {
      font-family: var(--font-kai);
      background: linear-gradient(160deg, var(--jade), var(--jade-deep));
      color: #04120b;
      border: none;
      font-weight: 700;
      padding: 0.7rem 1.6rem;
      border-radius: 24px;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(46, 125, 91, 0.35);
      touch-action: manipulation;
    }

    button.primary:active { transform: scale(0.97); }

    .chapter-list { display: grid; gap: 0.5rem; }

    .chapter-item {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 0.85rem 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      transition: border-color 0.18s ease, background 0.18s ease;
      touch-action: manipulation;
    }

    .chapter-item:active { background: var(--card2); }

    @media (hover: hover) {
      .chapter-item:hover { border-color: var(--jade-deep); }
    }

    .chapter-item .progress-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--rule);
      flex-shrink: 0;
    }

    .chapter-item.read .progress-dot {
      background: var(--jade);
      box-shadow: 0 0 6px rgba(76, 195, 138, 0.6);
    }

    /* ======= 阅读器 ======= */
    .reader-wrap { max-width: 680px; margin: 0 auto; }

    .reader-content {
      padding: 0.5rem 0.4rem calc(var(--bottombar-h) + env(safe-area-inset-bottom) + 24px);
      font-size: var(--reader-font-size);
      cursor: pointer;
    }

    .reader-content h1.chapter-title {
      text-align: center;
      font-size: 1.45em;
      font-weight: 700;
      margin: 0.8rem 0 2rem;
      letter-spacing: 0.14em;
      color: var(--ink);
    }

    .reader-content h1.chapter-title::after {
      content: "";
      display: block;
      width: 56px;
      height: 2px;
      margin: 1rem auto 0;
      background: linear-gradient(90deg, transparent, var(--jade-deep), transparent);
    }

    .block { margin-bottom: 1.7em; position: relative; }

    .block.highlight {
      background: var(--jade-dim);
      margin-left: -0.6rem; margin-right: -0.6rem;
      padding: 0.55rem 0.6rem;
      border-radius: 8px;
    }

    .block .source {
      font-size: 1em;
      line-height: 2;
      text-align: justify;
      color: var(--ink);
    }

    .block .translation {
      font-size: 0.82em;
      color: var(--muted);
      line-height: 1.9;
      margin-top: 0.7em;
      padding-left: 0.9em;
      border-left: 3px solid var(--jade-deep);
      text-align: justify;
    }

    .block.title-block { text-align: center; }

    .block.title-block .source {
      font-size: 1.15em;
      font-weight: 700;
      text-align: center;
      color: var(--jade);
      letter-spacing: 0.1em;
    }

    .block.title-block .translation { display: none; }

    .reader-content h2, .reader-content h3, .reader-content h4 {
      color: var(--jade);
      letter-spacing: 0.1em;
      margin: 0.6em 0;
      font-weight: 700;
    }

    .reader-content blockquote {
      border-left: 3px solid var(--rule);
      padding-left: 0.8em;
      color: var(--muted);
    }

    .reader-content hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--rule), transparent);
      margin: 1.4em 0;
    }

    .reader-content strong { color: var(--jade); font-weight: 700; }

    /* ======= 底部控制栏（阅读器） ======= */
    footer.bottombar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      background: rgba(7, 11, 9, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--rule);
      padding-bottom: env(safe-area-inset-bottom);
      transition: transform 0.32s ease;
    }

    body.chrome-off footer.bottombar { transform: translateY(110%); }

    .bottombar-inner {
      max-width: 760px;
      margin: 0 auto;
      min-height: var(--bottombar-h);
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 0.4rem;
      padding: 0.3rem 0.6rem;
    }

    .bar-btn {
      font-family: var(--font-kai);
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--ink);
      border-radius: 20px;
      padding: 0.42rem 0.95rem;
      font-size: 0.88rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      touch-action: manipulation;
      white-space: nowrap;
    }

    .bar-btn:active { background: var(--jade-dim); }

    .bar-btn.on {
      background: var(--jade-dim);
      border-color: var(--jade-deep);
      color: var(--jade);
    }

    .font-group { display: flex; align-items: center; gap: 0.15rem; }

    .font-display {
      font-size: 0.82rem;
      color: var(--muted);
      min-width: 2.9rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ======= 空状态 / 提示 ======= */
    .empty { text-align: center; padding: 4rem 1rem; color: var(--muted); }
    .empty h3 { font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--ink); letter-spacing: 0.1em; }

    .toast {
      position: fixed;
      bottom: calc(var(--bottombar-h) + env(safe-area-inset-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--card2);
      border: 1px solid var(--jade-deep);
      color: var(--ink);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 500;
    }

    .toast.show { opacity: 1; }

    ::selection { background: rgba(76, 195, 138, 0.3); }

    @media (max-width: 640px) {
      main { padding-left: 0.9rem; padding-right: 0.9rem; }
      .brand-title { letter-spacing: 0.14em; }
    }
  </style>
</head>
<body>
  <div class="progress-line" id="progress-line" style="display:none;">
    <div class="bar" id="progress-bar"></div>
  </div>

  <div id="app">
    <header class="topbar" id="topbar"></header>
    <main id="main"></main>
    <footer class="bottombar" id="bottombar" style="display:none;"></footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let appData = null;          // 目录数据（不含正文）
    let currentView = 'home';
    let currentBookId = null;
    let currentChapterId = null;
    let currentChapterData = null; // 当前章节解析结果 { blocks: [...] }
    const chapterCache = {};       // 章节缓存，key = bookId/chapterId
    let readerScrollHandler = null; // 阅读器滚动监听（离开阅读器即失效）
    let suppressProgress = false;   // 恢复阅读位置期间禁止写进度
    let suppressPush = false;       // 处理浏览器前进/后退时不再 pushState
    let readingMode = localStorage.getItem('xuanmen_mode') || 'mixed';
    let fontSize = parseInt(localStorage.getItem('xuanmen_fontsize') || '19', 10);

    const LS_KEY = 'xuanmen_progress';

    document.addEventListener('DOMContentLoaded', async () => {
      document.documentElement.style.setProperty('--reader-font-size', fontSize + 'px');
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      try {
        const res = await fetch('data/catalog.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('无法加载古籍目录');
        appData = await res.json();
        suppressPush = true;
        restoreLastPosition();
        suppressPush = false;
      } catch (err) {
        document.getElementById('main').innerHTML = `
          <div class="empty">
            <h3>数据加载失败</h3>
            <p>${err.message}</p>
            <p>请先运行 scripts/scan-guji.py 生成 data 目录数据</p>
          </div>`;
      }
    });

    // 直接加载 Markdown 源文件并在前端解析
    async function loadChapter(bookId, chapterMeta) {
      const key = bookId + '/' + chapterMeta.id;
      if (chapterCache[key]) return chapterCache[key];
      const base = 'data/books/' + encodeURIComponent(bookId) + '/';
      const srcRes = await fetch(base + '%E5%8E%9F%E6%96%87/' + encodeURIComponent(chapterMeta.file), { cache: 'no-cache' });
      if (!srcRes.ok) throw new Error('原文加载失败');
      const srcMd = await srcRes.text();
      let transMd = null;
      if (chapterMeta.hasTrans) {
        const tRes = await fetch(base + '%E8%AF%91%E6%96%87/' + encodeURIComponent(chapterMeta.file), { cache: 'no-cache' });
        if (tRes.ok) transMd = await tRes.text();
      }
      const data = { blocks: alignTranslation(parseSourceBlocks(srcMd), transMd) };
      chapterCache[key] = data;
      return data;
    }

    // 按空行切段，段内保留单换行
    function parseSourceBlocks(md) {
      return md.split(/\r?\n\s*\r?\n/)
        .map(s => s.trim())
        .filter(s => s && !/^-{3,}$/.test(s) && !/^(\*\s*){3,}$/.test(s))
        .map((s, i) => ({
          id: 'block-' + String(i + 1).padStart(3, '0'),
          type: /^#{1,6}\s/.test(s) ? 'title' : 'body',
          content: s.replace(/^#{1,6}\s*/, ''),
          translation: null
        }));
    }

    // 译文文件以 > 引用原文（可连续多行），其后为译文；与正文块按序配对
    function alignTranslation(blocks, transMd) {
      if (!transMd) return blocks;
      const units = [];
      let curTrans = [], inQuote = false, hasUnit = false;
      const flush = () => {
        if (hasUnit || curTrans.length) units.push(curTrans.join('\n\n'));
        curTrans = []; hasUnit = false;
      };
      for (const raw of transMd.split(/\r?\n/)) {
        const line = raw.trim();
        if (/^>\s*/.test(line)) {
          if (!inQuote) flush();
          hasUnit = true;
          inQuote = true;
        } else if (line && !/^#{1,6}\s/.test(line) && !/^-{3,}$/.test(line)) {
          inQuote = false;
          curTrans.push(line);
        } else if (!line) {
          // 空行结束当前引用块：下一个 > 将开启新的配对单元
          inQuote = false;
        }
      }
      flush();
      let ti = 0;
      for (const b of blocks) {
        if (b.type === 'title') continue;
        if (ti < units.length) { b.translation = units[ti] || null; ti++; }
      }
      return blocks;
    }

    function showLoading(text) {
      document.getElementById('main').innerHTML = `<div class="empty"><h3>${text || '加载中…'}</h3></div>`;
    }

    function getBook(id) {
      for (const cat of appData.categories) {
        const book = cat.books.find(b => b.id === id);
        if (book) return book;
      }
      return null;
    }

    function getProgress() {
      try {
        return JSON.parse(localStorage.getItem(LS_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveProgress(bookId, chapterId, blockId, percent, scrollY) {
      const progress = getProgress();
      progress[bookId] = { chapterId, blockId, percent, scrollY, updatedAt: Date.now() };
      localStorage.setItem(LS_KEY, JSON.stringify(progress));
    }

    function getChapterProgress(bookId, chapterId) {
      const p = getProgress()[bookId];
      return p && p.chapterId === chapterId ? p : null;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function setChrome(hidden) {
      document.body.classList.toggle('chrome-off', hidden);
    }

    function goHome() {
      currentView = 'home';
      currentBookId = null;
      currentChapterId = null;
      setChrome(false);
      updateUrl();
      render();
      window.scrollTo(0, 0);
    }

    function updateUrl() {
      if (suppressPush) return;
      const params = new URLSearchParams();
      if (currentBookId) params.set('book', currentBookId);
      if (currentChapterId) params.set('chapter', currentChapterId);
      const qs = params.toString();
      const url = qs ? '?' + qs : window.location.pathname;
      history.pushState(null, '', url);
    }

    // 浏览器前进/后退：按 URL 参数恢复到对应视图
    window.addEventListener('popstate', () => {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('book');
      const chapterId = params.get('chapter');
      suppressPush = true;
      if (bookId && getBook(bookId)) {
        if (chapterId) {
          const progress = getProgress()[bookId];
          const scrollY = progress && progress.chapterId === chapterId ? progress.scrollY : null;
          openReader(bookId, chapterId, null, scrollY);
        } else {
          openBook(bookId);
        }
      } else {
        goHome();
      }
      suppressPush = false;
    });

    // ======= 顶栏 / 底栏 =======
    function renderChrome() {
      const topbar = document.getElementById('topbar');
      const bottombar = document.getElementById('bottombar');

      if (currentView === 'home') {
        topbar.innerHTML = `
          <div class="topbar-inner">
            <div class="brand">
              <div class="brand-seal">玄门<br>正典</div>
              <div class="brand-title">玄门正典</div>
            </div>
            <div class="crumb"></div>
          </div>`;
        bottombar.style.display = 'none';
        document.getElementById('progress-line').style.display = 'none';
      } else if (currentView === 'book') {
        const book = getBook(currentBookId);
        topbar.innerHTML = `
          <div class="topbar-inner">
            <button class="nav-btn" onclick="goHome()">‹ 书架</button>
            <div class="crumb">${book.title}</div>
            <div class="pct"></div>
          </div>`;
        bottombar.style.display = 'none';
        document.getElementById('progress-line').style.display = 'none';
      } else if (currentView === 'reader') {
        const book = getBook(currentBookId);
        const chapter = book.chapters.find(c => c.id === currentChapterId);
        const isSingle = book.chapters.length === 1;
        const backAction = isSingle ? 'goHome()' : `openBook('${book.id}')`;
        const backLabel = isSingle ? '‹ 书架' : '‹ 目录';
        topbar.innerHTML = `
          <div class="topbar-inner">
            <button class="nav-btn" onclick="${backAction}">${backLabel}</button>
            <div class="crumb">${isSingle ? book.title : book.title + '<span class="sep">/</span>' + chapter.title}</div>
            <div class="pct" id="header-pct"></div>
          </div>`;
        const showTranslation = readingMode === 'mixed';
        bottombar.style.display = 'block';
        bottombar.innerHTML = `
          <div class="bottombar-inner">
            <button class="bar-btn ${showTranslation ? 'on' : ''}" id="btn-translate" onclick="toggleTranslation()">
              ${showTranslation ? '译文·开' : '译文·关'}
            </button>
            <div class="font-group">
              <button class="bar-btn" onclick="changeFontSize(-1)" aria-label="减小字号">A−</button>
              <span id="font-size-display" class="font-display">${fontSize}px</span>
              <button class="bar-btn" onclick="changeFontSize(1)" aria-label="增大字号">A+</button>
            </div>
          </div>`;
        document.getElementById('progress-line').style.display = 'block';
      }
    }

    // ======= 首页 =======
    function renderHome() {
      const main = document.getElementById('main');
      const total = appData.categories.reduce((sum, c) => sum + c.books.length, 0);
      let html = `
        <div class="hero">
          <h1>玄门正典</h1>
          <p>青灯古卷 · 共收录 ${total} 部经典</p>
        </div>
      `;

      for (const cat of appData.categories) {
        html += `<h3 class="section-title">${cat.name}<span class="count">${cat.books.length} 部</span></h3>`;
        html += `<div class="book-list">`;
        for (const book of cat.books) {
          const last = getProgress()[book.id];
          let meta = '';
          let progressBar = '';
          if (last) {
            const percent = Math.min(100, Math.round(last.percent || 0));
            if (book.chapters.length === 1) {
              meta = `已读 ${percent}%`;
            } else {
              meta = `已读至 · ${getChapterTitle(book, last.chapterId)}`;
            }
            progressBar = `<div class="book-progress"><div class="fill" style="width:${percent}%"></div></div>`;
          } else {
            meta = book.chapters.length === 1 ? '单篇' : `${book.chapters.length} 章`;
          }
          html += `
            <div class="book-row" role="button" tabindex="0"
                 onclick="openBook('${book.id}')"
                 onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openBook('${book.id}')}">
              <div class="book-spine"></div>
              <div class="book-info">
                <div class="book-title">${book.title}</div>
                <div class="book-meta">${meta}</div>
                ${progressBar}
              </div>
            </div>
          `;
        }
        html += `</div>`;
      }

      main.innerHTML = html;
      renderChrome();
    }

    function getChapterTitle(book, chapterId) {
      const ch = book.chapters.find(c => c.id === chapterId);
      return ch ? ch.title : '未知章节';
    }

    // ======= 书目详情 =======
    async function openBook(bookId) {
      currentBookId = bookId;
      currentChapterId = null;
      currentView = 'book';
      setChrome(false);

      const book = getBook(bookId);
      const progress = getProgress()[bookId];

      if (book && book.chapters.length === 1) {
        currentChapterId = book.chapters[0].id;
        currentView = 'reader';
        updateUrl();
        showLoading();
        try {
          const data = await loadChapter(bookId, book.chapters[0]);
          if (currentBookId !== bookId) return;
          currentChapterData = data;
          renderReader(null, progress && progress.scrollY ? progress.scrollY : null);
        } catch (err) {
          showToast(err.message);
          goHome();
        }
        return;
      }

      updateUrl();
      render();
      window.scrollTo(0, 0);
    }

    function renderBook() {
      const book = getBook(currentBookId);
      if (!book) return goHome();
      const progress = getProgress()[book.id];

      const main = document.getElementById('main');
      let html = `
        <div class="book-header">
          <h2>${book.title}</h2>
          <span class="category-tag">${book.category}</span>
        </div>
      `;

      if (progress) {
        const resumeScrollY = typeof progress.scrollY === 'number' ? progress.scrollY : null;
        html += `<div class="continue-wrap">
          <button class="primary" onclick="openReader('${book.id}', '${progress.chapterId}', '${progress.blockId || ''}', ${resumeScrollY})">继续阅读 · ${getChapterTitle(book, progress.chapterId)}</button>
        </div>`;
      }

      html += `<div class="chapter-list">`;
      for (const ch of book.chapters) {
        const chProgress = getChapterProgress(book.id, ch.id);
        const readClass = chProgress ? 'read' : '';
        html += `
          <div class="chapter-item ${readClass}" onclick="openReader('${book.id}', '${ch.id}')">
            <span>${ch.title}</span>
            <span class="progress-dot"></span>
          </div>
        `;
      }
      html += `</div>`;

      main.innerHTML = html;
      renderChrome();
    }

    // ======= 阅读器 =======
    async function openReader(bookId, chapterId, blockId, scrollY) {
      currentBookId = bookId;
      currentChapterId = chapterId;
      currentView = 'reader';
      setChrome(false);
      updateUrl();
      showLoading();
      try {
        const book = getBook(bookId);
        const chMeta = book ? book.chapters.find(c => c.id === chapterId) : null;
        if (!chMeta) throw new Error('章节不存在');
        const data = await loadChapter(bookId, chMeta);
        if (currentBookId !== bookId || currentView !== 'reader') return;
        currentChapterData = data;
        renderReader(blockId, scrollY);
      } catch (err) {
        showToast(err.message);
        openBook(bookId);
      }
    }

    function renderReader(targetBlockId, targetScrollY) {
      const book = getBook(currentBookId);
      if (!book) return goHome();
      const chapterMeta = book.chapters.find(c => c.id === currentChapterId);
      if (!chapterMeta || !currentChapterData) return goHome();
      const chapter = { id: chapterMeta.id, title: chapterMeta.title, blocks: currentChapterData.blocks };

      const main = document.getElementById('main');
      const showTranslation = readingMode === 'mixed';

      let html = `
        <div class="reader-wrap">
          <div class="reader-content" id="reader-content">
            <h1 class="chapter-title">${chapter.title}</h1>
      `;
      for (const block of chapter.blocks) {
        const isTitle = block.type === 'title';
        const titleClass = isTitle ? 'title-block' : '';
        const transHtml = (showTranslation && block.translation && !isTitle)
          ? `<div class="translation">${renderMarkdown(block.translation)}</div>`
          : '';
        const highlight = targetBlockId && block.id === targetBlockId ? 'highlight' : '';
        html += `
          <div class="block ${titleClass} ${highlight}" id="block-${block.id}" data-block-id="${block.id}">
            <div class="source">${renderMarkdown(block.content)}</div>
            ${transHtml}
          </div>
        `;
      }
      html += `</div></div>`;
      main.innerHTML = html;

      renderChrome();
      setupReaderScroll(book, chapter);
      setupTapToggle();

      if (targetBlockId) {
        suppressProgress = true;
        setTimeout(() => {
          const el = document.getElementById(`block-${targetBlockId}`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => el.classList.remove('highlight'), 3000);
          }
          setTimeout(() => { suppressProgress = false; }, 800);
        }, 100);
      } else if (typeof targetScrollY === 'number' && targetScrollY > 0) {
        // 瞬时跳转（绕过 CSS smooth），恢复期间不写进度，防止把"页面顶部"误存为进度
        suppressProgress = true;
        const root = document.documentElement;
        const prevBehavior = root.style.scrollBehavior;
        root.style.scrollBehavior = 'auto';
        const applyRestore = () => {
          const maxScroll = Math.max(0, root.scrollHeight - window.innerHeight);
          window.scrollTo(0, Math.min(targetScrollY, maxScroll));
        };
        requestAnimationFrame(() => {
          applyRestore();
          requestAnimationFrame(() => {
            applyRestore();
            root.style.scrollBehavior = prevBehavior;
            const doc = root.scrollHeight - window.innerHeight;
            const pct = doc > 0 ? Math.min(100, (window.scrollY / doc) * 100) : 0;
            document.getElementById('progress-bar').style.width = pct + '%';
            const pctEl = document.getElementById('header-pct');
            if (pctEl) pctEl.textContent = Math.round(pct) + '%';
            setTimeout(() => { suppressProgress = false; }, 300);
          });
        });
      } else {
        window.scrollTo(0, 0);
      }
    }

    // 点按正文中央区域呼出/隐藏工具栏（客户端式沉浸阅读）
    function setupTapToggle() {
      const content = document.getElementById('reader-content');
      let touchMoved = false;

      content.addEventListener('touchmove', () => { touchMoved = true; }, { passive: true });
      content.addEventListener('touchstart', () => { touchMoved = false; }, { passive: true });

      content.addEventListener('click', (e) => {
        if (touchMoved) return;
        if (window.getSelection && window.getSelection().toString()) return;
        if (e.target.closest('button, a')) return;
        setChrome(!document.body.classList.contains('chrome-off'));
      });
    }

    function setupReaderScroll(book, chapter) {
      const content = document.getElementById('reader-content');
      const blocks = content.querySelectorAll('.block');

      if (readerScrollHandler) window.removeEventListener('scroll', readerScrollHandler);

      const onScroll = () => {
        // 离开本章节后（返回书架/切换章节）旧监听立即失效，防止误写进度
        if (currentView !== 'reader' || currentBookId !== book.id || currentChapterId !== chapter.id) return;

        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const scrollPercent = docHeight > 0
          ? Math.min(100, Math.max(0, (window.scrollY / docHeight) * 100))
          : 0;

        document.getElementById('progress-bar').style.width = scrollPercent + '%';
        const pctEl = document.getElementById('header-pct');
        if (pctEl) pctEl.textContent = Math.round(scrollPercent) + '%';

        if (suppressProgress) return;

        const rect = content.getBoundingClientRect();
        let currentBlock = chapter.blocks[0];
        let maxVisible = 0;

        blocks.forEach(el => {
          const r = el.getBoundingClientRect();
          const visibleHeight = Math.max(0, Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0));
          if (visibleHeight > maxVisible) {
            maxVisible = visibleHeight;
            currentBlock = chapter.blocks.find(b => b.id === el.dataset.blockId);
          }
        });

        if (currentBlock) {
          saveProgress(book.id, chapter.id, currentBlock.id, scrollPercent, window.scrollY);
        }
      };

      readerScrollHandler = onScroll;
      window.addEventListener('scroll', onScroll, { passive: true });
      setTimeout(onScroll, 200);
    }

    function toggleTranslation() {
      readingMode = readingMode === 'mixed' ? 'source' : 'mixed';
      localStorage.setItem('xuanmen_mode', readingMode);
      const y = window.scrollY;
      render(null, y);
    }

    function changeFontSize(delta) {
      fontSize = Math.max(15, Math.min(28, fontSize + delta));
      localStorage.setItem('xuanmen_fontsize', fontSize);
      document.documentElement.style.setProperty('--reader-font-size', fontSize + 'px');
      const display = document.getElementById('font-size-display');
      if (display) display.textContent = fontSize + 'px';
    }

    function render(blockId, scrollY) {
      if (!appData) return;
      if (currentView === 'home') renderHome();
      else if (currentView === 'book') renderBook();
      else if (currentView === 'reader') renderReader(blockId, scrollY);
    }

    function restoreLastPosition() {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get('book');
      const chapterId = params.get('chapter');

      if (bookId && getBook(bookId)) {
        const book = getBook(bookId);
        const targetChapterId = chapterId || book.chapters[0].id;
        const progress = getProgress()[bookId];
        const scrollY = progress && progress.chapterId === targetChapterId ? progress.scrollY : null;
        openReader(bookId, targetChapterId, null, scrollY);
      } else {
        goHome();
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderMarkdown(text) {
      if (!text) return '';
      let html = escapeHtml(text);
      html = html.replace(/\\n/g, '\n');
      html = html.replace(/\r\n/g, '\n');

      html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
      html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
      html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
      html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/_(.+?)_/g, '<em>$1</em>');

      html = html.replace(/^&gt;\s*(.+)$/gm, '<blockquote>$1</blockquote>');

      html = html.replace(/^-{3,}$/gm, '<hr>');
      html = html.replace(/^(\*\s*){3,}$/gm, '<hr>');

      html = html.replace(/\n/g, '<br>');

      return html;
    }
  </script>
</body>
</html>
